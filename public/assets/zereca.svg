      <!-- lower blades -->
      <path d="M101.2 143.1 L92.8 152.5 L72.4 134.1 Z"/>
      <path d="M103.9 146.5 L95.8 156.4 L117.6 184.7 Z"/>
      <!-- central spike -->
      <path d="M105.0 115.3 L120.6 147.3 L121.3 152.6 L127.3 190.4 L127.3 134.6 Z"/>
    </g>
  </defs>

  <g transform="translate(-3.4,0)">
