  <desc>Symmetric cleanup — left half is the source of truth, right half is an exact mirror</desc>
  <defs>
    <g id="half" fill="none" stroke="#000" stroke-width="1" stroke-linejoin="round" stroke-linecap="round">
      <!-- upper fan / wing -->
      <path d="M44.6 47.3 L108.8 98.5 L100.9 106.4 Z"/>
      <path d="M44.6 47.3 L68.4 117.9 L95.1 131.8 L76.1 113.1 Z"/>
      <!-- inner shard -->
